<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta
      name="description"
      content="VHOTIEX AI — futuristic holographic assistant interface"
    />
    <title>VHOTIEX AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">V</div>
          <div>
            <b>VHOTIEX</b>
            <small>AI SUITE</small>
          </div>
        </div>
        <div class="system-status">
          <span class="status-dot"></span>
          SYSTEM ONLINE
        </div>
      </header>

      <div class="layout">
        <section class="hero-panel">
          <div class="panel-top">
            <span class="mini-chip">LIVE</span>
            <span id="agentState">ORACLE</span>
          </div>

          <div class="orb-stage">
            <div id="threeRoot" aria-label="Holographic core visualization"></div>
            <div class="core-glow"></div>
            <div class="orbit orbit-one"></div>
            <div class="orbit orbit-two"></div>
            <div class="orbit orbit-three"></div>
            <div class="scanline"></div>
            <div class="crosshair crosshair-a"></div>
            <div class="crosshair crosshair-b"></div>
            <div class="orb-caption">
              <span>HOLO CORE</span>
              <b id="modeLabel">STANDBY</b>
            </div>
          </div>

          <div class="telemetry">
            <div>
              <small>MODE</small>
              <b id="coreState">IDLE</b>
            </div>
            <div>
              <small>LINK</small>
              <b id="connectionLabel">CORE STANDBY</b>
            </div>
            <div>
              <small>ACTIVITY</small>
              <b id="activityValue">12.8%</b>
            </div>
          </div>
        </section>

        <aside class="control-panel">
          <div class="agent-row">
            <label for="agentSelect">AGENT</label>
            <select id="agentSelect" aria-label="Select agent">
              <option value="ORACLE">ORACLE</option>
              <option value="NEXUS">NEXUS</option>
              <option value="FORGE">FORGE</option>
              <option value="SENTINEL">SENTINEL</option>
            </select>
          </div>

          <div class="chat-log" id="chatLog">
            <div class="message bot">
              <span class="message-tag">VHOTIEX / ORACLE</span>
              <p>Welcome back. I’m ready to assist with planning, coding, and analysis.</p>
            </div>
            <div class="message user">
              <span class="message-tag">YOU / COMMAND</span>
              <p>Build a clean installable web app package.</p>
            </div>
          </div>

          <form id="chatForm" class="composer">
            <textarea id="promptInput" placeholder="Ask VHOTIEX AI..." aria-label="Ask VHOTIEX AI"></textarea>
            <div class="composer-actions">
              <button type="button" class="icon-button" id="voiceButton">VOICE</button>
              <button type="submit" class="send-button" id="sendButton">SEND</button>
            </div>
          </form>

          <div class="quick-actions">
            <button type="button" data-prompt="Summarize the current build status.">SUMMARIZE</button>
            <button type="button" data-prompt="Draft a secure deployment plan.">DEPLOY</button>
            <button type="button" data-prompt="Create a clean code review checklist.">REVIEW</button>
          </div>

          <footer>VHOTIEX / ACTIVE</footer>
        </aside>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
